[project]
name = "smol-ladder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=1.0",
  "pandas",
  "pyarrow",
  "numpy",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "matplotlib",
  "seaborn",
  "tabulate",
  "math-verify",
  "openpyxl",
  "kagglehub>=1.0.2",
]

# Post-training. Optional and deliberately heavy: the eval harness needs none of it, and the
# existing suite runs in seconds without it. `uv run --extra train python -m train.sft_lora`.
# torch is pinned to a CUDA 12.x wheel set because that is what both the RTX 4050 and Kaggle's T4
# driver stacks want; a CPU-only default would silently make the smoke run 50x slower.
[project.optional-dependencies]
train = [
  "torch>=2.6",
  "transformers>=5.17",
  "trl>=1.13",
  "peft>=0.21",
  "accelerate>=1.0",
  "datasets>=5.0",
  "bitsandbytes>=0.45",
]

# Installed by a plain `uv run`, so the quick test loop can render a chat template (tests/test_render.py)
# without the multi-gigabyte `train` extra.
[dependency-groups]
dev = ["jinja2>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Only our own tests. Left unset, pytest walks the `data` and `logs` symlinks into the shared
# results tree and collects 90,632 tests -- scipy's own test suite vendored into a trial by an
# agent that `pip download`ed it, plus files that are not importable. Every one of them is
# somebody else's file, and the collection pass alone took 80s.
testpaths = ["tests"]
# `slow` marks the tests that sweep a whole split or walk the whole results tree: they are
# correct and they are the ones the full suite exists for, but they take minutes, so the quick
# loop is `pytest -m "not slow"` (README). Nothing is marked slow for being fragile or broken;
# only for being wide.
markers = [
  "slow: sweeps a whole split or walks the whole results tree; run with the full suite",
]

